# Values here mirror backend/.env.example, which mirrors the defaults in
# backend/app/config.py. Change a setting in one place and carry it to the
# others, otherwise local and deployed drift apart.
services:
  - type: web
    name: knowledge-assistant-backend
    runtime: docker
    plan: free
    # `main` is the repository default. Deploys track it so local,
    # preview and production all build from the same branch.
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    envVars:
      # `production` is what forces `Secure` on the session cookies and refuses to
      # seed an administrator from `AUTH_SEED_ADMIN_*`. Nothing else in the
      # blueprint sets it, so without this the service would run with development
      # cookie flags in production.
      - key: ENVIRONMENT
        value: "production"

      # Signs the session and CSRF tokens. Set in the Render dashboard; a random
      # value of at least 32 characters. Rotating it signs everybody out.
      - key: AUTH_SECRET_KEY
        sync: false

      # The one-time key that admits the first administrator through
      # `POST /api/auth/bootstrap-admin`. Set in the dashboard, and removed once a
      # real administrator exists — from then on the route answers 409 whatever the
      # key is.
      - key: AUTH_BOOTSTRAP_KEY
        sync: false

      # Generation key, set in the Render dashboard. An absent or revoked key does
      # not stop the service booting, it only makes /chat fail, so /health
      # reports it.
      - key: NVIDIA_API_KEY
        sync: false

      # Retrieval key, kept separate so embedding traffic has its own quota.
      # Required at startup: the policy documents are embedded while the index is
      # built, so a missing key here is a failed deploy rather than a 503.
      - key: NVIDIA_EMBEDDING_API_KEY
        sync: false

      # NVIDIA serves an OpenAI-compatible API at this base URL.
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1

      - key: LLM_MODEL
        value: openai/gpt-oss-20b

      - key: LLM_TEMPERATURE
        value: "0.5"

      - key: LLM_TOP_P
        value: "1"

      - key: LLM_MAX_TOKENS
        value: "1024"

      # A 429/5xx is retried with backoff before a question gives up with a 503.
      - key: LLM_MAX_ATTEMPTS
        value: "3"

      - key: EMBED_MODEL
        value: nvidia/nemotron-3-embed-1b

      # Tuned against this embedding model with `python scripts/tune.py`, which
      # prints the score of every retrieved chunk. A threshold that is too high
      # makes every question look like "not found".
      - key: MIN_SCORE
        value: "0.40"

      # Retrieval is hybrid: vector similarity and BM25 keyword matching, fused.
      # The two candidate depths are how far each search looks *before* the
      # fusion, so they are deliberately deeper than the four chunks the generator
      # finally reads — a chunk outside both top-N cannot reach the fused top-N.
      # `VECTOR_CANDIDATES` is load-bearing beyond ranking: it is also the window
      # the keyword half may rescue from, so shrinking it removes candidates rather
      # than only reordering them. Left unset in the blueprint on purpose: the code
      # defaults are the tuned values, and repeating them here is a second place
      # for them to drift.
      #
      # `KEYWORD_MIN_SCORE` is a BM25 score, not a similarity. It is not comparable
      # with `MIN_SCORE` and must not be tuned against it.
      #
      # `RECALL_FLOOR` is deliberately NOT a lower `MIN_SCORE`, and the two must not
      # be merged. On this embedding model the answerable and unanswerable score
      # ranges overlap (answerable as low as 0.22, unanswerable as high as 0.32), so
      # no relevance threshold separates them. `RECALL_FLOOR` only applies when
      # nothing cleared `MIN_SCORE`, and hands those chunks to the generator to rule
      # on — it never re-ranks a question that already had a real match.

      # The deployed Angular frontend. Listed explicitly (no wildcard) so
      # credentialed CORS responses carry a concrete `Access-Control-Allow-Origin`
      # and the CSRF origin check has something real to compare against.
      #
      # The browser reaches the API through the frontend's own `/api` proxy rather
      # than calling this service directly, so this list is no longer what makes
      # sign-in work. It is still needed, because the proxy forwards the browser's
      # `Origin` and the CSRF check compares it against the same value.
      - key: ALLOWED_ORIGINS
        value: "https://knowledge-assistant-chatbot-app.onrender.com"

      # Must match the browser's exact origin (`https`, host, no trailing slash).
      # `localhost` and `127.0.0.1` are different origins; a mismatch shows up as
      # a 403 on state-changing calls, not as a CORS error.
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://knowledge-assistant-chatbot-app.onrender.com"

      # Where invitation links point. The backend default is localhost, which is
      # useless once deployed.
      - key: FRONTEND_BASE_URL
        value: "https://knowledge-assistant-chatbot-app.onrender.com"

      # Neon, set in the Render dashboard. This service no longer provisions a
      # database of its own, so local and deployed run against the same Neon
      # instance and a migration cannot land in only one of them.
      - key: DATABASE_URL
        sync: false

  # The Angular app, server-rendered, so it needs a Node runtime and not a static
  # host: `ng build` emits both the browser bundle and the Express server that
  # renders the first paint.
  - type: web
    # No name on purpose. Render generates a free one, which is the way out here:
    # "knowledge-assistant-frontend" is already taken by an unrelated Vite app, and
    # a blueprint cannot claim a name that is in use. The name is also the hostname,
    # so read the generated URL off the service page after the first deploy rather
    # than assuming it.
    runtime: node
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run serve:ssr:frontend

    envVars:
      # Angular 22 requires ^22.22.3, ^24.15.0 or newer, and resolves the 24.x line
      # to whatever is current. `PORT` is set by Render and read by src/server.ts,
      # so it is not declared here.
      - key: NODE_VERSION
        value: "24"

      # NODE_ENV must NOT be set to production on this service.
      #
      # It breaks the build. npm skips devDependencies when NODE_ENV=production, the
      # Angular CLI is a devDependency, so the install quietly removes it and the
      # build then fails with `sh: 1: ng: not found` — which says nothing about the
      # cause. `scripts/check_build_env.mjs` runs before the build and names it, but
      # the fix is to leave NODE_ENV unset: nothing in this server needs it, since
      # API_ORIGIN is read directly.
      #
      # It is worth stating because setting it is a reasonable-looking thing to do on
      # a Node service, and it was set here to make a missing API_ORIGIN a loud error
      # instead of a silent fallback to localhost.

      # Where the API is. This server answers `/api` itself, forwarding to the
      # backend named here — which is what `config.json` (set to "") asks for.
      #
      # It is what makes sign-in work on a phone as well as on a laptop, and the
      # reason is a cookie rather than a line of code. The session is two `httpOnly`
      # cookies, and the browser decides whether to attach them from the site the
      # request goes to. Have the browser call the backend on its own origin and
      # those cookies are third-party, so Safari and Chrome apply their
      # third-party cookie policies to them — per browser, per device, with nothing
      # in the app to account for the difference. Routed through this server, the
      # API is on the same origin as the page and the cookies are first-party by
      # construction, so there is no longer a browser decision to get wrong.
      - key: API_ORIGIN
        value: "https://knowledge-assistant-chatbot.onrender.com"
